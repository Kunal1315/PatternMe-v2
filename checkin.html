<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6957e8"><title>Daily check-in • PatternMe</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/checkin.css"><script src="js/app.js" defer></script></head><body><nav class="navbar navbar-expand-lg sticky-top" id="mainNav"></nav><main class="page-wrap"><div class="mb-4"><div class="eyebrow">DAILY CHECK-IN</div><h1 class="page-title">How was your day?</h1><p class="muted">A few quick details can help you understand your routine over time.</p></div><div id="message" class="alert d-none"></div><form id="entryForm" class="pm-card"><div class="form-section-title">Your day</div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="entryDate">Entry date</label><input class="form-control" id="entryDate" type="date" required></div><div class="col-md-6 d-flex align-items-end"><p class="muted small" id="dateHint">Select a date to add or edit an entry.</p></div><div class="col-md-6"><label class="form-label" for="sleep">Sleep (hours)</label><input class="form-control" id="sleep" type="number" min="0" max="24" step=".25" placeholder="7.5" required></div><div class="col-md-6"><label class="form-label" for="study">Study / work (hours)</label><input class="form-control" id="study" type="number" min="0" max="24" step=".25" placeholder="3" required></div><div class="col-md-6"><label class="form-label" for="screen">Screen time (hours)</label><input class="form-control" id="screen" type="number" min="0" max="24" step=".25" placeholder="4" required></div><div class="col-md-6"><label class="form-label" for="exercise">Exercise (minutes)</label><input class="form-control" id="exercise" type="number" min="0" max="1440" step="1" placeholder="20" required></div><div class="col-md-6"><label class="form-label" for="focus">Focus rating</label><select class="form-select" id="focus" required><option value="">Choose 1–5</option><option value="1">1 · Very low</option><option value="2">2 · Low</option><option value="3">3 · Average</option><option value="4">4 · Good</option><option value="5">5 · Excellent</option></select></div><div class="col-md-6"><label class="form-label" for="mood">Mood</label><select class="form-select" id="mood" required><option value="">Choose mood</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Stressed</option><option>Tired</option></select></div><div class="col-12"><label class="form-label" for="notes">Notes (optional)</label><textarea class="form-control" id="notes" rows="3" maxlength="600" placeholder="What went well today? What would you change tomorrow?"></textarea></div></div><div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary" type="submit">Save check-in</button><button class="btn btn-outline-secondary" type="button" id="clearBtn">Clear form</button><a class="btn btn-outline-secondary" href="history.html">View history</a></div></form><footer class="footer">© <span id="currentYear"></span> PatternMe · Your data stays in this browser.</footer></main><script src="js/checkin.js" defer></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script></body></html>
