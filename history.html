<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6957e8">
    <title>History • PatternMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/history.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top" id="mainNav"></nav>
    <main class="page-wrap">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <div class="eyebrow">YOUR JOURNEY</div>
                <h1 class="page-title">Check-in history</h1>
                <p class="muted mb-0">Review, edit, or export your saved days.</p>
            </div><button class="btn btn-primary" id="exportBtn">↓ Export CSV</button>
        </div>
        <section class="pm-card table-card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Sleep</th>
                            <th>Study</th>
                            <th>Screen</th>
                            <th>Exercise</th>
                            <th>Focus</th>
                            <th>Mood</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>
            <div id="historyEmpty" class="empty-state d-none">
                <div class="empty-icon">☷</div><strong>No check-ins yet</strong>
                <p>Record your first day to see your history here.</p><a href="checkin.html" class="btn btn-primary">Add
                    check-in</a>
            </div>
        </section>
        </main>
        <footer class="footer">© <span id="currentYear"></span> PatternMe · Your data stays in this browser.</footer>
    
    <script src="js/history.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>

</html>
